name: Build all platforms (unsigned test builds)
on:
  push:
    branches: ['claude/release-*']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash -eo pipefail {0}
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x', dotnet-quality: 'preview' }
      - shell: pwsh
        run: |
          dotnet publish windows/KL06.Windows/KL06.Windows.csproj -c Release -r win-x64 --self-contained false -o out/KL06-Windows-x64 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed' }
          Compress-Archive -Path out/KL06-Windows-x64/* -DestinationPath KL06-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: KL06-Windows-x64, path: "KL06-Windows-x64.zip\nbuild.log" }
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --write-locks 2>&1 | tee ../build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: KL06-Android-debug, path: "android/app/build/outputs/apk/debug/*.apk\nbuild.log" }
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash macos/BUILD-MAC.command 2>&1 | tee build.log
      - run: cd macos/Local-build && for d in */; do ditto -c -k --keepParent "$d/KL-06 Manager.app" "../../KL06-macOS.zip"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: KL06-macOS, path: "KL06-macOS.zip\nbuild.log" }
  ios-cinelog:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          xcodebuild -project ios/CineLog/CineLog.xcodeproj -scheme CineLog -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" -derivedDataPath dd build 2>&1 | tee build.log
          mkdir -p Payload && cp -R dd/Build/Products/Release-iphoneos/*.app Payload/ && zip -qr CineLog-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: CineLog-iOS-unsigned, path: "CineLog-unsigned.ipa\nbuild.log" }
  ios-kl06:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          xcodebuild -project ios/KL06Mobile.xcodeproj -scheme KL06Mobile -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" -derivedDataPath dd build 2>&1 | tee build.log
          mkdir -p Payload && cp -R dd/Build/Products/Release-iphoneos/*.app Payload/ && zip -qr KL06Mobile-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: KL06Mobile-iOS-unsigned, path: "KL06Mobile-unsigned.ipa\nbuild.log" }
