name: Portable source checks
on:
  push:
    branches: [fix/real-connectivity-transfer-logs]
  workflow_dispatch:
permissions:
  contents: write
  statuses: write
concurrency:
  group: kl06-portable-${{ github.ref }}
  cancel-in-progress: false
jobs:
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Regenerate source-only hashes with race-safe branch update
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            python3 automation/source_manifest.py --write
            if git diff --quiet -- SOURCE-MANIFEST.json SHA256SUMS; then
              echo "Source manifests already current."
              exit 0
            fi
            git add SOURCE-MANIFEST.json SHA256SUMS
            git commit -m "chore: refresh reviewed source integrity manifest"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Branch advanced during manifest update; retrying against latest branch."
          done
          echo "Could not publish source manifests after five branch-race retries." >&2
          exit 1
      - name: Check JavaScript syntax
        run: |
          node --check shared/web/app.js
          node --check macos/Resources/app.js
      - name: Run isolated portable tests
        id: portable
        run: /bin/bash TEST-PORTABLE.sh
      - name: Report portable test result on the final branch commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_OUTCOME: ${{ steps.portable.outcome }}
        run: |
          STATE=success
          DESCRIPTION="Portable source tests passed; no native/device approval implied."
          if [ "$TEST_OUTCOME" != "success" ]; then
            STATE=failure
            DESCRIPTION="Portable source tests failed; inspect the workflow log."
          fi
          HEAD_SHA="$(git rev-parse HEAD)"
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -d "{\"state\":\"$STATE\",\"context\":\"KL-06 portable source checks\",\"description\":\"$DESCRIPTION\"}"

  apple-native-builds:
    permissions:
      contents: read
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run macOS native source tests and build
        env:
          KL06_REVEAL_BUILD: '0'
        run: |
          /bin/bash macos/TEST-MAC.command
          /bin/bash macos/BUILD-MAC.command
      - name: Compile iOS simulator app without signing
        run: /bin/bash ios/BUILD-IOS.command --simulator
      - name: Package Intel Mac app for owner review
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find macos/Local-build -type d -name 'KL-06 Manager.app' -print -quit)"
          test -n "$APP"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$APP" dist/KL-06-Manager-macOS-Intel-UNVERIFIED.zip
          shasum -a 256 dist/KL-06-Manager-macOS-Intel-UNVERIFIED.zip | tee dist/SHA256SUMS.txt
      - name: Upload Mac candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: KL-06-Manager-macOS-Intel-UNVERIFIED
          path: |
            dist/KL-06-Manager-macOS-Intel-UNVERIFIED.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  android-native-build:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify trusted runner SDK prerequisites
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_17_X64:?JDK 17 is required on the runner}"
          export PATH="$JAVA_HOME/bin:$PATH"
          export ANDROID_HOME="${ANDROID_HOME:?Android SDK is required on the runner}"
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -f "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('android/gradle/wrapper/gradle-wrapper.jar')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f'
          PY
      - name: Assemble and verify Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          export ANDROID_HOME="$ANDROID_HOME"
          cd android
          /bin/bash ./gradlew --no-daemon --max-workers=2 :app:assembleDebug
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
