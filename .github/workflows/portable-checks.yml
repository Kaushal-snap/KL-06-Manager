name: Portable source checks
on:
  push:
    branches: [fix/real-connectivity-transfer-logs]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kl06-portable-${{ github.ref }}
  cancel-in-progress: false
jobs:
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Regenerate source-only hashes after reviewed changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 automation/source_manifest.py --write
          if ! git diff --quiet -- SOURCE-MANIFEST.json SHA256SUMS; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add SOURCE-MANIFEST.json SHA256SUMS
            git commit -m "chore: refresh reviewed source integrity manifest"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
              curl --fail-with-body --silent --show-error -X POST \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/portable-checks.yml/dispatches" \
                -d '{"ref":"fix/real-connectivity-transfer-logs"}'
            fi
          fi
      - name: Check JavaScript syntax
        run: |
          node --check shared/web/app.js
          node --check macos/Resources/app.js
      - name: Run isolated portable tests
        run: /bin/bash TEST-PORTABLE.sh
