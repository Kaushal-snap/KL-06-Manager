name: Import Drive App Build to Draft Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run validation only (do not stage release)'
        required: true
        type: boolean
        default: true
      expected_sha256:
        description: 'Expected SHA-256 of the uploaded app ZIP'
        required: false
        type: string
      version_tag:
        description: 'Target beta tag (e.g. v0.2.1-beta.3)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  validate-and-stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run release automation tests
        run: |
          python3 -m unittest tests/test_release_automation.py

      - name: Release staging notice
        run: |
          echo "Release automation validator verified."
          echo "Gated release policy: Staged releases MUST be DRAFT PRERELEASE."
          echo "Final publication requires explicit owner review."
