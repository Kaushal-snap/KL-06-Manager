name: Exact owner-tested Drive ZIP to private beta
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate only; create or change no GitHub release
        type: boolean
        default: true
  schedule:
    - cron: '37 * * * *'
permissions: {}
concurrency:
  group: kl06-exact-tested-drive-release
  cancel-in-progress: false
jobs:
  transfer:
    if: github.ref == 'refs/heads/main' && (vars.KL06_ENABLE_DRIVE_RELEASES == 'true' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == true))
    environment: drive-beta
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Read this repository without persisting a Git credential
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, immutable reviewed commit
        with:
          persist-credentials: false
      - name: Refuse public, wrong-name, fork or non-main repositories before Drive auth
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 automation/drive_release.py --preflight-only
      - name: Authenticate read-only Drive through short-lived workload identity
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # immutable reviewed action.yml uses Node24; older README examples differ
        with:
          workload_identity_provider: ${{ vars.KL06_GOOGLE_WIF_PROVIDER }}
          service_account: ${{ vars.KL06_GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
          access_token_lifetime: 1200s
          create_credentials_file: false
          export_environment_variables: false
      - name: Verify offline owner signature, native-test declarations and exact ZIP before transfer
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRIVE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          KL06_DRIVE_APP_FOLDER_ID: ${{ vars.KL06_DRIVE_APP_FOLDER_ID }}
          KL06_ENABLE_DRIVE_RELEASES: ${{ vars.KL06_ENABLE_DRIVE_RELEASES }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = true ]; then
            python3 automation/drive_release.py --dry-run
          else
            python3 automation/drive_release.py
          fi
# No pull_request trigger, archive execution, rebuild, token upload, stable/public
# publication, shared credentials or default "approve" file. Disabled until owner setup.
